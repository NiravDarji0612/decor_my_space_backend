---
openapi: 3.0.1
info:
  title: DecorMySpace API
  version: v1
  description: Backend API for the DecorMySpace Flutter application
  contact:
    name: API Support
paths:
  "/api/v1/add_ons":
    get:
      summary: List active booking add-ons
      tags:
      - Catalogue
      responses:
        '200':
          description: add-ons returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      add_ons:
                        type: array
                        items:
                          "$ref": "#/components/schemas/add_on"
  "/api/v1/addresses":
    get:
      summary: List addresses for current user
      tags:
      - Addresses
      security:
      - bearer_auth: []
      responses:
        '200':
          description: addresses returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      addresses:
                        type: array
                        items:
                          "$ref": "#/components/schemas/address"
        '401':
          description: missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
    post:
      summary: Create an address
      tags:
      - Addresses
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: address created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      address:
                        "$ref": "#/components/schemas/address"
        '422':
          description: validation errors
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/address_request"
  "/api/v1/addresses/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Get an address
      tags:
      - Addresses
      security:
      - bearer_auth: []
      responses:
        '200':
          description: address returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      address:
                        "$ref": "#/components/schemas/address"
        '404':
          description: address not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
    patch:
      summary: Update an address
      tags:
      - Addresses
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: address updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      address:
                        "$ref": "#/components/schemas/address"
        '404':
          description: address not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/address_request"
    delete:
      summary: Delete an address
      tags:
      - Addresses
      security:
      - bearer_auth: []
      responses:
        '200':
          description: address removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/success_response"
        '404':
          description: address not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/addresses/{id}/default":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Mark an address as default
      tags:
      - Addresses
      security:
      - bearer_auth: []
      responses:
        '200':
          description: default updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      address:
                        "$ref": "#/components/schemas/address"
        '404':
          description: address not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/bookings":
    parameters:
    - name: status
      in: query
      required: false
      enum:
      - upcoming
      - completed
      - cancelled
      schema:
        type: string
    - name: page
      in: query
      required: false
      schema:
        type: integer
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
    get:
      summary: List current user bookings
      tags:
      - Bookings
      security:
      - bearer_auth: []
      responses:
        '200':
          description: bookings returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      bookings:
                        type: array
                        items:
                          "$ref": "#/components/schemas/booking"
                  meta:
                    "$ref": "#/components/schemas/pagination_meta"
        '401':
          description: missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
    post:
      summary: Create a booking
      tags:
      - Bookings
      description: Creates a booking. Pricing (subtotal, 18% GST, 30% advance) is
        computed server-side.
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: booking created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Booking confirmed
                  data:
                    type: object
                    properties:
                      booking:
                        "$ref": "#/components/schemas/booking"
        '404':
          description: design not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '422':
          description: validation errors
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/booking_request"
  "/api/v1/bookings/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Get booking details
      tags:
      - Bookings
      security:
      - bearer_auth: []
      responses:
        '200':
          description: booking returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      booking:
                        "$ref": "#/components/schemas/booking"
        '404':
          description: booking not found or not owned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/bookings/{id}/cancel":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Cancel a booking
      tags:
      - Bookings
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: booking cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Booking cancelled
                  data:
                    type: object
                    properties:
                      booking:
                        "$ref": "#/components/schemas/booking"
        '422':
          description: already cancelled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '404':
          description: booking not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/cancel_booking_request"
  "/api/v1/categories":
    get:
      summary: List active categories
      tags:
      - Catalogue
      description: Returns active categories ordered by position.
      responses:
        '200':
          description: categories returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items:
                          "$ref": "#/components/schemas/category"
  "/api/v1/categories/{slug}":
    parameters:
    - name: slug
      in: path
      required: true
      example: wedding
      schema:
        type: string
    get:
      summary: Get a category by slug
      tags:
      - Catalogue
      responses:
        '200':
          description: category returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      category:
                        "$ref": "#/components/schemas/category"
        '404':
          description: category not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/categories/{slug}/designs":
    parameters:
    - name: slug
      in: path
      required: true
      example: wedding
      schema:
        type: string
    - name: sort
      in: query
      required: false
      enum:
      - popular
      - price_asc
      - price_desc
      - rating
      schema:
        type: string
    - name: page
      in: query
      required: false
      schema:
        type: integer
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
    get:
      summary: List designs in a category
      tags:
      - Catalogue
      responses:
        '200':
          description: designs returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      category:
                        "$ref": "#/components/schemas/category"
                      designs:
                        type: array
                        items:
                          "$ref": "#/components/schemas/design_summary"
                  meta:
                    "$ref": "#/components/schemas/pagination_meta"
        '404':
          description: category not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/decorators":
    parameters:
    - name: city
      in: query
      required: false
      schema:
        type: string
    - name: q
      in: query
      required: false
      schema:
        type: string
    - name: page
      in: query
      required: false
      schema:
        type: integer
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
    get:
      summary: List decorators (vendors)
      tags:
      - Catalogue
      responses:
        '200':
          description: decorators returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      decorators:
                        type: array
                        items:
                          "$ref": "#/components/schemas/decorator"
                  meta:
                    "$ref": "#/components/schemas/pagination_meta"
  "/api/v1/decorators/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Get decorator details with design gallery
      tags:
      - Catalogue
      responses:
        '200':
          description: decorator details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      decorator:
                        "$ref": "#/components/schemas/decorator_detail"
        '404':
          description: decorator not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/designs":
    parameters:
    - name: slug
      in: query
      required: false
      description: Filter by category slug
      schema:
        type: string
    - name: q
      in: query
      required: false
      description: Search term
      schema:
        type: string
    - name: sort
      in: query
      required: false
      enum:
      - popular
      - price_asc
      - price_desc
      - rating
      schema:
        type: string
    - name: page
      in: query
      required: false
      schema:
        type: integer
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
    get:
      summary: List designs
      tags:
      - Catalogue
      responses:
        '200':
          description: designs returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      designs:
                        type: array
                        items:
                          "$ref": "#/components/schemas/design_summary"
                  meta:
                    "$ref": "#/components/schemas/pagination_meta"
  "/api/v1/designs/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Get design details
      tags:
      - Catalogue
      responses:
        '200':
          description: design details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      design:
                        "$ref": "#/components/schemas/design"
        '404':
          description: design not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/home/feed":
    parameters:
    - name: city
      in: query
      required: false
      schema:
        type: string
    get:
      summary: Aggregated home feed
      tags:
      - Home
      description: Returns categories, featured designs, trending designs and nearby
        vendors.
      security:
      - bearer_auth: []
      responses:
        '200':
          description: feed returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items:
                          "$ref": "#/components/schemas/category"
                      featured_designs:
                        type: array
                        items:
                          "$ref": "#/components/schemas/design_summary"
                      trending_designs:
                        type: array
                        items:
                          "$ref": "#/components/schemas/design_summary"
                      nearby_vendors:
                        type: array
                        items:
                          "$ref": "#/components/schemas/decorator"
        '401':
          description: missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/notifications":
    parameters:
    - name: unread
      in: query
      required: false
      schema:
        type: boolean
    - name: page
      in: query
      required: false
      schema:
        type: integer
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
    get:
      summary: List notifications
      tags:
      - Notifications
      security:
      - bearer_auth: []
      responses:
        '200':
          description: notifications returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      notifications:
                        type: array
                        items:
                          "$ref": "#/components/schemas/notification"
                      unread_count:
                        type: integer
                        example: 1
                  meta:
                    "$ref": "#/components/schemas/pagination_meta"
        '401':
          description: missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/notifications/read_all":
    patch:
      summary: Mark all notifications as read
      tags:
      - Notifications
      security:
      - bearer_auth: []
      responses:
        '200':
          description: marked as read
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/success_response"
        '401':
          description: missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/notifications/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    delete:
      summary: Dismiss a notification
      tags:
      - Notifications
      security:
      - bearer_auth: []
      responses:
        '200':
          description: dismissed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/success_response"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/payment_methods":
    get:
      summary: List payment methods
      tags:
      - Payment methods
      security:
      - bearer_auth: []
      responses:
        '200':
          description: payment methods returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      payment_methods:
                        type: array
                        items:
                          "$ref": "#/components/schemas/payment_method"
        '401':
          description: missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
    post:
      summary: Add a payment method
      tags:
      - Payment methods
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: payment method added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      payment_method:
                        "$ref": "#/components/schemas/payment_method"
        '422':
          description: validation errors
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/payment_method_request"
  "/api/v1/payment_methods/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    delete:
      summary: Remove a payment method
      tags:
      - Payment methods
      security:
      - bearer_auth: []
      responses:
        '200':
          description: removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/success_response"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/payment_methods/{id}/default":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Mark a payment method as default
      tags:
      - Payment methods
      security:
      - bearer_auth: []
      responses:
        '200':
          description: default updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      payment_method:
                        "$ref": "#/components/schemas/payment_method"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/preferences":
    get:
      summary: Get user preferences
      tags:
      - Preferences
      security:
      - bearer_auth: []
      responses:
        '200':
          description: preferences returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      preferences:
                        "$ref": "#/components/schemas/user_preference"
        '401':
          description: missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
    patch:
      summary: Update user preferences
      tags:
      - Preferences
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: preferences updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      preferences:
                        "$ref": "#/components/schemas/user_preference"
        '422':
          description: invalid locale
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/preferences_request"
  "/api/v1/profile":
    get:
      summary: Get current user profile
      tags:
      - Profile
      description: Returns the authenticated user's profile information. Requires
        a valid JWT access token.
      security:
      - bearer_auth: []
      responses:
        '200':
          description: profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        "$ref": "#/components/schemas/user"
        '401':
          description: invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
    patch:
      summary: Update profile
      tags:
      - Profile
      description: Updates editable profile fields for the authenticated user.
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Profile updated
                  data:
                    type: object
                    properties:
                      user:
                        "$ref": "#/components/schemas/user"
        '401':
          description: missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '422':
          description: invalid username
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/profile_update_request"
  "/api/v1/account":
    delete:
      summary: Delete (soft-delete) the current account
      tags:
      - Profile
      security:
      - bearer_auth: []
      responses:
        '200':
          description: account deleted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/success_response"
        '401':
          description: missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/profile/password":
    patch:
      summary: Change password
      tags:
      - Profile
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: password changed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/success_response"
        '422':
          description: new password mismatch
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/change_password_request"
  "/api/v1/profile/email/request":
    post:
      summary: Request OTP to change email
      tags:
      - Profile
      security:
