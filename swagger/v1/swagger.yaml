      summary: Authenticate a user
      tags:
      - Authentication
      description: Validates credentials and returns JWT access and refresh tokens.
      parameters: []
      responses:
        '200':
          description: login is case-insensitive for email
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Logged in successfully
                  data:
                    type: object
                    properties:
                      user:
                        "$ref": "#/components/schemas/user"
                      tokens:
                        "$ref": "#/components/schemas/tokens"
        '401':
          description: non-existent user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/login_request"
  "/api/v1/refresh":
    post:
      summary: Refresh access token
      tags:
      - Authentication
      description: Exchanges a valid refresh token for new access and refresh tokens.
      security:
      - bearer_auth: []
      responses:
        '200':
          description: tokens refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Token refreshed successfully
                  data:
                    type: object
                    properties:
                      tokens:
                        "$ref": "#/components/schemas/tokens"
        '401':
          description: no token provided
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/logout":
    delete:
      summary: Log out current session
