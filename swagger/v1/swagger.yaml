  "/api/v1/users/{id}/location":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Update the current user location
      tags:
      - Geolocation
      description: 'Persists the user current coordinates and appends a row to the
        location history. Authorisation: a user can only update their own location.'
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: location updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Location updated successfully
                required:
                - success
                - message
        '403':
          description: cannot update another user location
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '422':
          description: missing coordinates
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '404':
          description: user not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/user_location_request"
  "/api/v1/vendors/nearby":
    parameters:
    - name: latitude
      in: query
      required: true
      example: 23.0225
      schema:
        type: number
    - name: longitude
      in: query
      required: true
      example: 72.5714
      schema:
        type: number
    - name: radius
      in: query
      required: false
      description: Radius in km (default 5).
      schema:
        type: number
    - name: category
      in: query
      required: false
      schema:
        type: string
    - name: min_rating
      in: query
      required: false
      schema:
        type: number
    - name: open
      in: query
      required: false
      schema:
        type: boolean
    - name: page
      in: query
      required: false
      schema:
        type: integer
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
    get:
      summary: Fetch vendors within a radius, sorted by distance
      tags:
      - Geolocation
      description: Uses PostGIS ST_DWithin / ST_Distance when available; otherwise
        falls back to Haversine SQL.
      security:
      - bearer_auth: []
      responses:
        '200':
          description: empty when no vendors in radius
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      vendors:
                        type: array
                        items:
                          "$ref": "#/components/schemas/nearby_vendor"
                  meta:
                    "$ref": "#/components/schemas/nearby_meta"
        '422':
          description: missing coordinates
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
servers:
- url: http://localhost:3000
  description: Development server
- url: https://{productionHost}
  description: Production server
  variables:
    productionHost:
      default: api.decormyspace.com
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from login or register
  schemas:
    success_response:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
    error_response:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            type: string
    pagination_meta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 42
        total_pages:
          type: integer
          example: 3
    user:
      type: object
      properties:
        id:
          type: integer
          example: 1
        full_name:
          type: string
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane@example.com
        phone:
          type: string
          example: "+15550001111"
        account_type:
          type: string
          enum:
          - customer
          - vendor
          example: customer
        username:
          type: string
          nullable: true
          example: jane_d
        city:
          type: string
          nullable: true
          example: Pune
        bio:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
          example: https://i.pravatar.cc/200
        email_verified:
          type: boolean
          example: false
        phone_verified:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
          example: '2026-05-19T12:00:00Z'
      required:
      - id
      - full_name
      - email
      - phone
      - account_type
      - created_at
    tokens:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token (24h expiry)
        refresh_token:
          type: string
          description: JWT refresh token (30d expiry)
        expires_in:
          type: integer
          description: Access token TTL in seconds
          example: 86400
      required:
      - access_token
      - refresh_token
      - expires_in
    registration_request:
      type: object
      properties:
        user:
          type: object
          properties:
            full_name:
              type: string
              example: Jane Doe
              minLength: 2
            email:
              type: string
              format: email
              example: jane@example.com
            phone:
              type: string
              example: "+15550001111"
            password:
              type: string
              minLength: 8
              example: securepass123
            account_type:
              type: string
              enum:
              - customer
              - vendor
              example: customer
            accepted_terms:
              type: boolean
              example: true
          required:
          - full_name
          - email
          - phone
          - password
          - account_type
          - accepted_terms
      required:
      - user
    login_request:
      type: object
      properties:
        session:
          type: object
          properties:
            email:
              type: string
              format: email
              example: jane@example.com
            password:
              type: string
              example: securepass123
          required:
          - email
          - password
      required:
      - session
    profile_update_request:
      type: object
      properties:
        user:
          type: object
          properties:
            full_name:
              type: string
            username:
              type: string
            city:
              type: string
            bio:
              type: string
            avatar_url:
              type: string
      required:
      - user
    change_password_request:
      type: object
      properties:
        password:
          type: object
          properties:
            current_password:
              type: string
              example: oldpassword123
            new_password:
              type: string
              example: newpassword123
            new_password_confirmation:
              type: string
              example: newpassword123
          required:
          - current_password
          - new_password
          - new_password_confirmation
      required:
      - password
    request_email_change_request:
      type: object
      properties:
        email:
          type: object
          properties:
            new_email:
              type: string
              format: email
              example: new@example.com
          required:
          - new_email
      required:
      - email
    confirm_email_change_request:
      type: object
      properties:
        code:
          type: string
          example: '123456'
        new_email:
          type: string
          format: email
          example: new@example.com
      required:
      - code
      - new_email
    request_phone_change_request:
      type: object
      properties:
        phone:
          type: object
          properties:
            new_phone:
              type: string
              example: "+15550009999"
          required:
          - new_phone
      required:
      - phone
    confirm_phone_change_request:
      type: object
      properties:
        code:
          type: string
          example: '123456'
        new_phone:
          type: string
          example: "+15550009999"
      required:
      - code
      - new_phone
    category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        slug:
          type: string
          example: wedding
        title:
          type: string
          example: Wedding
        icon_key:
          type: string
          nullable: true
          example: celebration
        tint_hex:
          type: string
          nullable: true
          example: "#FCE4EC"
        icon_color_hex:
          type: string
          nullable: true
          example: "#C2185B"
        cover_url:
          type: string
          nullable: true
        design_count:
          type: integer
          example: 12
        position:
          type: integer
          example: 1
      required:
      - id
      - slug
      - title
    decorator:
      type: object
      properties:
        id:
          type: integer
          example: 7
        name:
          type: string
          example: Bloom Decor Studio
        specialty:
          type: string
          nullable: true
          example: Wedding specialist
        tagline:
          type: string
          nullable: true
        rating_avg:
          type: number
          format: float
          example: 4.8
        review_count:
          type: integer
          example: 124
        avatar_url:
          type: string
          nullable: true
        hourly_rate_rupees:
          type: number
          format: float
          example: 2500.0
        area:
          type: string
          nullable: true
          example: Koregaon Park
        city:
          type: string
          nullable: true
          example: Pune
        phone:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
      required:
      - id
      - name
      - rating_avg
      - review_count
    decorator_detail:
      allOf:
      - "$ref": "#/components/schemas/decorator"
      - type: object
        properties:
          bio:
            type: string
            nullable: true
          designs:
            type: array
            items:
              "$ref": "#/components/schemas/design_summary"
    design_summary:
      type: object
      properties:
        id:
          type: integer
          example: 42
        title:
          type: string
          example: Royal Mandap Floral Setup
        subtitle:
          type: string
          nullable: true
        price_rupees:
          type: integer
          example: 45000
        currency:
          type: string
          example: INR
        rating_avg:
          type: number
          format: float
          example: 4.9
        review_count:
          type: integer
          example: 56
        hero_image_url:
          type: string
          nullable: true
        available:
          type: boolean
          example: true
        featured:
          type: boolean
          example: true
        trending:
          type: boolean
          example: false
        vendor_name:
          type: string
          nullable: true
          example: Bloom Decor Studio
        category_slug:
          type: string
          nullable: true
          example: wedding
      required:
      - id
      - title
      - price_rupees
      - currency
      - available
    design:
      allOf:
      - "$ref": "#/components/schemas/design_summary"
      - type: object
        properties:
          description:
            type: string
            nullable: true
          gallery:
            type: array
            items:
              type: string
          inclusions:
            type: array
            items:
              type: object
              properties:
                label:
                  type: string
                  example: Floral mandap
                icon_key:
                  type: string
                  nullable: true
                  example: local_florist
          decorator:
            "$ref": "#/components/schemas/decorator"
          category:
            "$ref": "#/components/schemas/category"
    add_on:
      type: object
      properties:
        id:
          type: integer
          example: 1
        key:
          type: string
          example: photography
        label:
          type: string
          example: Photography Package
        description:
          type: string
          nullable: true
        price_rupees:
          type: integer
          example: 15000
      required:
      - id
      - key
      - label
      - price_rupees
    booking:
      type: object
      properties:
        id:
          type: integer
          example: 101
        booking_reference:
          type: string
          example: DMS-AB12CD34
        status:
          type: string
          enum:
          - upcoming
          - completed
          - cancelled
        event_type:
          type: string
          example: Wedding
        event_date:
          type: string
          format: date
          example: '2026-08-21'
        time_slot:
          type: string
          example: 18:00-22:00
        expected_guests:
          type: integer
          example: 250
        venue_name:
          type: string
          example: Taj Banquet Hall
        venue_address_line1:
          type: string
          example: MG Road
        venue_address_line2:
          type: string
          nullable: true
        contact_full_name:
          type: string
          example: Riya Shah
        contact_phone:
          type: string
          example: "+919812345678"
        contact_email:
          type: string
          format: email
        special_instructions:
          type: string
          nullable: true
        subtotal_rupees:
          type: integer
          example: 60000
        gst_rupees:
          type: integer
          example: 10800
        total_rupees:
          type: integer
          example: 70800
        advance_paid_rupees:
